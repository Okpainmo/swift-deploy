services:
  image: "sd-demo-api-1:latest"
  port: 5000
  mode: stable
  version: 1.0.0
  restart_policy: unless-stopped

nginx:
  image: "nginx:latest"
  port: 8080
  proxy_timeout: 5s
  contact: ops@swiftdeploy.local

network:
  name: swiftdeploy-net
  driver_type: bridge

opa:
  image: "openpolicyagent/opa:latest"
  port: 8181

policy_infrastructure:
  min_disk_free_gb: 10
  max_cpu_load: 2.0

policy_canary:
  max_error_rate: 0.01
  max_p99_latency_ms: 500
  window_seconds: 30
